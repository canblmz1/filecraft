name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri build -- --bundles nsis
        working-directory: apps/desktop
      - name: Collect the unsigned installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
      - uses: actions/upload-artifact@v4
        id: unsigned
        with:
          name: windows-installer-unsigned
          path: dist/*.exe
          if-no-files-found: error
      # Runs once SignPath has approved the project and the repository
      # variables and secret from docs/development/SIGNING.md are set.
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Prepare release files
        shell: pwsh
        run: |
          $source = if (Test-Path signed/*.exe) { 'signed' } else { 'dist' }
          if ($source -eq 'dist') { Write-Warning 'SignPath is not configured, so the installer is unsigned.' }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "$source/*.exe" release/
          Get-ChildItem release/*.exe | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*
          if-no-files-found: error
      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --title "FileCraft $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes 'Built by the release workflow. Review before publishing.'
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem release/*).FullName --clobber
