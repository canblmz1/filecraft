[package]
name = "filecraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets the CLI and desktop download the pinned FFmpeg build on request.
installer = ["dep:ureq", "dep:zip"]

[dependencies]
fs2 = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lopdf = { version = "0.47", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
