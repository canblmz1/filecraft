[workspace]
members = ["apps/desktop/src-tauri", "crates/filecraft-core", "crates/filecraft-cli"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
filecraft-core = { path = "crates/filecraft-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
